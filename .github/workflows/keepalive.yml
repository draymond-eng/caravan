# Pings the Supabase project daily so the free-tier database never pauses
# from inactivity (Supabase pauses projects idle ~7 days; a paused project
# makes the app error until manually restored).
name: Supabase keep-alive
on:
  schedule:
    - cron: "41 7 * * *"   # daily, 07:41 UTC
  workflow_dispatch: {}     # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -sS -f \
            -H "apikey: sb_publishable_Mcu1nZ6YTnjsq_fiFka4Iw_sLRcS08v" \
            -H "Authorization: Bearer sb_publishable_Mcu1nZ6YTnjsq_fiFka4Iw_sLRcS08v" \
            "https://wkazcpezjughsggluafd.supabase.co/rest/v1/trips?select=code&limit=1" > /dev/null
          echo "Supabase pinged OK"
